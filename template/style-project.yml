# 设置为 true，可在构建期间将 DOCX 公式转换为 MathType OLE 对象。
# 新项目默认启用；本地转换环境不可用时会回退到原生 Word 公式。
mathtype: true

# MathType 转换后端：rust、rust-sdk、set-data、auto 或 both。
# rust: 跨平台 LaTeX -> mathtype-rust OLE/MTEF + latex2wmf WMF/JSON。
# set-data: LaTeX -> MathType OLE TeX 输入 -> OLE/WMF/JSON。
# auto: Windows 且 MathType 可用时依次尝试 set-data、rust-sdk、rust；否则直接使用 rust。
# both: 仅限 Windows；同时使用 rust 和 set-data，仅比较 OLE 中的 MTEF 公式数据流，不同时发出警告，并采用 set-data 的结果。
mathtypeConversionMethod: rust

# 跨平台 rust 后端使用的 SVG 渲染器：ratex 或 typst。
# ratex 直接解析 LaTeX；typst 通过 MiTeX 转换，默认使用内置的 XITS Math 字体，
# 并读取公式框的实际基线深度。
mathtypeSvgBackend: typst

# Typst 数学字体：可填写字体名称，或 .otf/.ttf/.ttc/.otc 字体文件路径。
# 开箱即用的数学字体：XITS Math（本工具内置）、New Computer Modern Math（Typst 内置）。
# 其他字体可先安装后填写名称，或直接填写文件路径，无需安装。
# 相对路径以本 style.yml 所在目录为基准，例如 fonts/STIXTwoMath-Regular.otf。
# 仅影响 rust 路径的公式预览；both 最终采用 MathType 原生结果，不使用此字体设置。
# 字符串表示主体与花体都使用同一字体。例如：
# mathtypeTypstMathFont: XITS Math
# 对象的 font、calligraphicFont 都必须填写，以下也是未配置时的默认值。
mathtypeTypstMathFont:
  font: XITS Math
  calligraphicFont: New Computer Modern Math

# true 使用 Word 原生 REF/SEQ 域和章节多级列表编号。
# false 保留原有 Pandoc 编号和超链接引用行为。
docxNativeCrossref: false

# 设置为 true，可在构建 DOCX 时将引用的 SVG 文件中的本地子图像内嵌。
# 这样既能保持 SVG 文本和矢量元素清晰，又能让链接的子图像在 Word 中可见。
# 当 docxConvertSvgToPng 为 true 时，此功能会自动禁用。
docxEmbedSvgImages: true

# 设置为 true，可在构建 DOCX 时将所有引用的 SVG 图像栅格化为 PNG。
# 如果只需栅格化单个 SVG，请为该图像设置 `{to-png=true}`。
# 可再为该图像添加 `to-png-scale=2`，以覆盖全局 PNG 缩放比例。

docxConvertSvgToPng: false
# 以下 SVG 转 PNG 尺寸控制选项最多只能启用一个，建议都不启用。
# docxSvgToPngWidth: 1600
# docxSvgToPngDpi: 300
# docxSvgToPngScale: 1

# 设置 citeproc 折叠数字引文范围的分隔符。设置为 "-" 可生成 [1-3]
# citationNumberRangeDelimiter: "-"

# 常规 DOCX 默认连续行号，中文 DOCX 默认不显示。中文需连续行号请显式设置为 true。
# 也可用 '每页重编' 或 '每节重编' 指定重新编号方式。
docxShowLineNumbers: continuous

# 控制 DOCX 页脚中的自动页码。true 会使用 page number 字符样式插入页码，false 会移除页码。
# 不设置时保留 reference DOCX 中原有的页脚内容。
docxShowPageNumbers: true

# docxPageMargins: # 控制输出的 DOCX 页面边距。
#   top: 2.54cm
#   bottom: 2.54cm
#   left: 3.17cm
#   right: 3.17cm

# docxStyle: ## DOCX 段落样式格式（后处理时按精确的样式名称应用）
#   Heading 1: { fontSize: 小四 }
#   Heading 2: { fontSize: 小四 }
#   Body Text:
#     firstLineIndentChars: 2
#     paragraphSpacing:
#       before: 0pt
#       after: 0pt

# reply: 审稿回复输出的覆盖配置。`papper build-reply` 会将上方的顶层元数据与本节合并，
#   docxStyle:
#     Body Text:
#       firstLineIndentChars: 0
#       paragraphSpacing:
#         before: 6pt
#         after: 6pt
#   pandocMetadata: {}

## 本节会作为 metadata 传给 Pandoc、pandoc-crossref 和 citeproc。
## 请将稿件特有的元数据保留在 manuscript.md 中。构建时，稿件 YAML 头部中定义的值会覆盖这些默认值。
## 可用值参考 https://pandoc.org/MANUAL.html https://lierdakil.github.io/pandoc-crossref/
# pandocMetadata:
#   # 题注前缀格式：{figureTitle} {number}{titleDelim} {caption}
#   figureTitle: "Figure "
#   tableTitle: "Table "
#   titleDelim: ""

#   # 项目交叉引用格式
#   figPrefix: "Figure"
#   tblPrefix: "Table"
#   secPrefix: "Section"
#   eqnPrefix: "Equation"

#   # 章节编号和自动标签选项
#   linkReferences: true        # 将引用转换为超链接
#   autoSectionLabels: true     # 自动为章节标签添加 "sec:" 前缀
#   autoEqnLabels: true         # 为所有行间公式编号
#   numberSections: true        # 为章节编号，如 1.1、1.2 等
#   sectionsDepth: 3            # 章节编号深度
#   subfigGrid: true            # 支持子图网格布局
#   subfigureChildTemplate: ($$i$$) $$t$$
#   subfigureTemplate: $$figureTitle$$ $$i$$$$titleDelim$$ $$t$$

#   # 参考文献章节标题
#   reference-section-title: References
#   link-citations: true

#   # 引文样式语言（CSL）文件
#   # 默认：一般 DOCX 使用 Vancouver；中文 DOCX 使用内置 GB/T 7714—2015（顺序编码，双语）
#   # 可从 https://www.zotero.org/styles 下载 CSL 文件
#   csl: pandoc/csl/elsevier-vancouver.csl
