[package]
name = "papper-svg-skia-benchmark"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "papper-svg-skia-benchmark"

# Keep experimental native dependencies out of the production workspace.
[workspace]

[[bin]]
name = "papper-svg-skia-benchmark"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"
# The published Windows SVG cache includes GL; rendering still uses a CPU surface.
skia-safe = { version = "=0.153.3", features = ["svg", "textlayout", "gl"] }
