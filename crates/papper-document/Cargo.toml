[package]
name = "papper-document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
regex.workspace = true
roxmltree.workspace = true
html-escape.workspace = true
zip.workspace = true
papper-core.workspace = true
papper-platform.workspace = true
papper-engine.workspace = true
serde_yaml.workspace = true
fancy-regex.workspace = true
# Reply line lookup uses native PDF text extraction without rendering or OCR.
pdf_oxide = { version = "=0.3.78", default-features = false }
sha2.workspace = true
tempfile.workspace = true
encoding_rs = "0.8"
# Bake imported Word crops without relying on an external image editor.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
# Read SVG viewport units without rewriting paths, text, or embedded resources.
usvg.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
