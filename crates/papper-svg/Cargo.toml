[package]
name = "papper-svg"
default-run = "papper-svg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
flate2.workspace = true
usvg.workspace = true
skia-safe.workspace = true
roxmltree.workspace = true
sha2.workspace = true
tempfile.workspace = true
# The official Windows Skia SVG archive omits WebP; retain SVG image compatibility.
image-webp = "0.2.4"

# These platform additions match upstream's published SVG archive variants.
[target.'cfg(target_os = "linux")'.dependencies]
skia-safe = { workspace = true, features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
skia-safe = { workspace = true, features = ["metal"] }
