# Pandoc HTML output configuration
# Usage: pandoc --defaults pandoc-html.yml

verbosity: WARNING
standalone: true
data-dir: ${.}/
# Keep the result as one portable HTML file for direct browser viewing.
embed-resources: false
template: ${.}/templates/default.html
math-method:
  # method: mathjax
  # url: "https://cdn.jsdmirror.com/npm/mathjax@4/tex-chtml.js"
  method: katex
  url: "https://cdn.jsdmirror.com/npm/katex@latest/dist/"
columns: 1
# Filters are applied in order so cross-references and citations are resolved
# before Pandoc writes the standalone HTML document.
filters:
  - ${.}/filters/shared/bracketed_lists.lua
  - ${.}/filters/shared/fix_math.lua
  - ${.}/filters/shared/bilingual_captions.lua
  - ${.}/filters/shared/table_autofit.lua
  - pandoc-crossref
  - ${.}/filters/shared/subfigure_layout_styles.lua
  - ${.}/filters/shared/normalize_chinese_numbering.lua
  - ${.}/filters/shared/bilingual_captions.lua
  - ${.}/filters/shared/merge_table_cells.lua
  - ${.}/filters/shared/paragraph_custom_styles.lua
  - ${.}/filters/html/revision_table_styles.lua
  - citeproc
