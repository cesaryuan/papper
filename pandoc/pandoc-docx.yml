# Pandoc DOCX output configuration
# Usage: pandoc --defaults pandoc.yml

verbosity: WARNING
standalone: true
# Keep `csl` out of this defaults file. The generated metadata file supplies the
# effective CSL consistently for every output target.
reference-doc: ${.}/manuscript-template/reference-doc.docx
# Custom XML template for DOCX formatting
template: ${.}/templates/default.xml

# Filters are applied in order
filters:
  - ${.}/filters/docx/equation_revision_attr.lua
  # Preserve original display/inline context before pandoc-crossref can turn
  # tab-layout display equations into InlineMath. Equation attributes must be
  # extracted first because its filter expects DisplayMath to lead the block.
  - ${.}/filters/docx/mathtype_markers.lua
  # Mark number boundaries before crossref; emit native fields after Chinese
  # number normalization. Enabled only by the manuscript DOCX build environment.
  - ${.}/filters/docx/native_crossrefs.lua
  - pandoc-crossref  # Must come before citeproc
  - ${.}/filters/shared/normalize_chinese_numbering.lua
  - ${.}/filters/docx/native_crossrefs.lua
  - ${.}/filters/shared/merge_table_cells.lua
  - ${.}/filters/shared/paragraph_custom_styles.lua
  - ${.}/filters/docx/inline_math_spacing.lua
  - citeproc
  - ${.}/filters/docx/citation_number_range_delimiter.lua
  # Resolve numeric citation links only after citeproc supplies bibliography labels.
  - ${.}/filters/docx/native_citations.lua
  - ${.}/filters/docx/italic_to_emphasis_style.lua
  - ${.}/filters/docx/captionless_image_style.lua
