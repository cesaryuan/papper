[project]
name = "papper"
version = "0.8.6"
description = "Papper: a Markdown-first academic manuscript workflow with DOCX-focused post-processing"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "cesaryuan" },
]
keywords = ["pandoc", "docx", "manuscript", "markdown", "academic-writing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "python-docx>=1.1.0",
  "pyyaml>=6.0",
  "lxml>=4.9.0",
  "panflute>=2.3.0",
  "pymupdf>=1.26.0",
  "pydantic-settings>=2.2.1",
  "packaging>=24.2",
  "python-dotenv>=1.0.0",
  "py7zr>=0.22.0",
  "resvg-py>=0.3.3",
  "tqdm>=4.68.3",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9"]

[tool.bumpversion]
current_version = "0.8.6"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore: release {new_version}"
tag_message = "Release {new_version}"
allow_dirty = false

[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"papper\"\nversion = \"{current_version}\""
replace = "name = \"papper\"\nversion = \"{new_version}\""

[project.scripts]
papper = "pandoc_manuscript.cli:main"
# Keep pmt as a compatibility alias for existing user scripts.
pmt = "pandoc_manuscript.cli:main"

[project.urls]
Homepage = "https://github.com/cesaryuan/papper"
Repository = "https://github.com/cesaryuan/papper"
Issues = "https://github.com/cesaryuan/papper/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build]
exclude = [
  ".git",
  ".pmt",
  ".pandoc-cache",
  ".vscode",
  "output",
  "tmp",
  "**/__pycache__",
  "**/*.pyc",
  "scripts/mathtype-rust/target",
  "scripts/latex2wmf/target",
]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/pandoc_manuscript"]
exclude = [
  "src/pandoc_manuscript/mathtype/ole_helper/**",
  "src/pandoc_manuscript/mathtype/bin/mathtype-rust",
  "src/pandoc_manuscript/mathtype/bin/mathtype-rust.exe",
  "src/pandoc_manuscript/mathtype/bin/latex2wmf",
  "src/pandoc_manuscript/mathtype/bin/latex2wmf.exe",
  "src/pandoc_manuscript/mathtype/bin/*latex2wmf*.dll",
  "src/pandoc_manuscript/mathtype/bin/*latex2wmf*.so",
  "src/pandoc_manuscript/mathtype/bin/*latex2wmf*.dylib",
]

[tool.hatch.build.targets.wheel.force-include]
"pandoc" = "pandoc_manuscript/pandoc"
"template" = "pandoc_manuscript/_template"
