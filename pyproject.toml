[project]
name = "papper"
version = "0.10.5"
description = "Papper: a Markdown-first academic manuscript workflow with DOCX-focused post-processing"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "cesaryuan" },
]
keywords = ["pandoc", "docx", "manuscript", "markdown", "academic-writing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[dependency-groups]
# Python inspects native output artifacts; the product implementation is Rust.
dev = [
  "pytest>=9.1.1",
  "python-docx>=1.1.0",
  "pyyaml>=6.0",
  "lxml>=4.9.0",
  "pymupdf>=1.26.0",
  "olefile>=0.47",
  "playwright==1.58.0",
  "pillow==12.1.0",
]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy"]
markers = ["visual: HTML browser or DOCX Word rendering compared with reviewed image baselines"]

[tool.ruff.lint]
select = ["E9"]

[tool.bumpversion]
current_version = "0.10.5"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore: release {new_version}"
tag_message = "Release {new_version}"
allow_dirty = false

[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"papper\"\nversion = \"{current_version}\""
replace = "name = \"papper\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "Cargo.toml"
search = "[workspace.package]\nversion = \"{current_version}\""
replace = "[workspace.package]\nversion = \"{new_version}\""

# Keep --locked release builds valid, without changing third-party crate versions.
[[tool.bumpversion.files]]
filename = "Cargo.lock"
search = "name = \"papper-cli\"\nversion = \"{current_version}\""
replace = "name = \"papper-cli\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "Cargo.lock"
search = "name = \"papper-core\"\nversion = \"{current_version}\""
replace = "name = \"papper-core\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "Cargo.lock"
search = "name = \"papper-dev\"\nversion = \"{current_version}\""
replace = "name = \"papper-dev\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "Cargo.lock"
search = "name = \"papper-document\"\nversion = \"{current_version}\""
replace = "name = \"papper-document\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "Cargo.lock"
search = "name = \"papper-engine\"\nversion = \"{current_version}\""
replace = "name = \"papper-engine\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "Cargo.lock"
search = "name = \"papper-platform\"\nversion = \"{current_version}\""
replace = "name = \"papper-platform\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "Cargo.lock"
search = "name = \"papper-server\"\nversion = \"{current_version}\""
replace = "name = \"papper-server\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "Cargo.lock"
search = "name = \"papper-svg\"\nversion = \"{current_version}\""
replace = "name = \"papper-svg\"\nversion = \"{new_version}\""

[project.urls]
Homepage = "https://github.com/cesaryuan/papper"
Repository = "https://github.com/cesaryuan/papper"
Issues = "https://github.com/cesaryuan/papper/issues"

[build-system]
requires = []
build-backend = "papper_build"
backend-path = ["tools"]
