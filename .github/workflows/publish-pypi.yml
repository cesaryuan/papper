name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Default-branch builds warm caches that later release tags can restore.
    # GitHub does not apply path filters to tag pushes.
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/**"
      - "tools/**"
      - "pyproject.toml"
      - "pandoc/**"
      - "template/**"
      - "scripts/mathtype-rust"
      - "scripts/mathtype-rust/**"
      - "scripts/latex2wmf"
      - "scripts/latex2wmf/**"
      - "scripts/pandoc-server/**"
      - "src/pandoc_manuscript/mathtype/Times+Symbol 12.eqp"
      - "src/pandoc_manuscript/mathtype/ole_helper/**"
      - ".github/workflows/publish-pypi.yml"
      - ".gitmodules"
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.98.0"
  CARGO_INCREMENTAL: "0"
  GHC_VERSION: "9.14.1"
  CABAL_VERSION: "3.18.1.0"

jobs:
  build-wheels:
    name: Build ${{ matrix.os }} wheel
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.pmt/native-target

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_SUBMODULES_TOKEN }}
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set macOS 14 deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Prevent a newer macOS SDK from producing helpers that macOS 14.6
          # cannot load when the floating macos-latest image advances.
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      # Cargo fetches Git dependencies in its own cache, outside checkout's
      # credential scope. Keep the rewrite limited to the private dependency.
      - name: Authenticate private Cargo dependencies
        shell: bash
        env:
          PRIVATE_SUBMODULES_TOKEN: ${{ secrets.PRIVATE_SUBMODULES_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${PRIVATE_SUBMODULES_TOKEN}@github.com/cesaryuan/latex2wmf".insteadOf \
            "https://github.com/cesaryuan/latex2wmf"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal
          rustup show active-toolchain
          cargo --version

      - name: Identify native sources
        id: native-sources
        shell: bash
        run: |
          echo "revision=$(git rev-parse HEAD:scripts/mathtype-rust)-$(git rev-parse HEAD:scripts/latex2wmf)" >> "$GITHUB_OUTPUT"

      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .pmt/native-target
          key: native-v2-${{ matrix.os }}-${{ runner.arch }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'scripts/mathtype-rust/Cargo.lock', 'scripts/latex2wmf/Cargo.lock', 'tools/papper-dev/**', '.github/workflows/publish-pypi.yml') }}-${{ steps.native-sources.outputs.revision }}-${{ hashFiles('src/pandoc_manuscript/mathtype/Times+Symbol 12.eqp') }}
          restore-keys: |
            native-v2-${{ matrix.os }}-${{ runner.arch }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-
            native-v1-${{ matrix.os }}-${{ runner.arch }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Check .NET SDK for the Windows helper
        if: runner.os == 'Windows'
        run: dotnet --version

      - name: Install pinned Haskell toolchain
        id: haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Restore Pandoc worker dependency cache
        id: haskell-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            scripts/pandoc-server/dist-newstyle
            .pmt/pandoc-worker
            .pmt/pandoc-source
          key: pandoc-worker-v2-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-${{ hashFiles('scripts/pandoc-server/**/*.hs', 'scripts/pandoc-server/*.cabal', 'scripts/pandoc-server/cabal.project', 'tools/papper-dev/**', '.github/workflows/publish-pypi.yml') }}
          restore-keys: |
            pandoc-worker-v2-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-
            pandoc-worker-v1-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-

      - name: Build native platform wheel
        # Dependencies are repaired before runtime.zip is embedded. Wheel repair
        # cannot inspect the binaries hidden inside the native CLI's archive.
        run: cargo run --locked -p papper-dev -- wheel --output dist

      - name: Smoke test installed native wheel
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem dist/*.whl)
          if ($wheels.Count -ne 1) { throw 'Expected one newly built platform wheel' }
          cargo run --locked -p papper-dev -- smoke --wheel $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Native wheel installation and conversion checks failed' }

      # Save only on main: caches written under one tag cannot serve another tag.
      - name: Save Rust build cache
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .pmt/native-target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Save Pandoc worker dependency cache
        if: github.ref == 'refs/heads/main' && steps.haskell-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            scripts/pandoc-server/dist-newstyle
            .pmt/pandoc-worker
            .pmt/pandoc-source
          key: ${{ steps.haskell-cache.outputs.cache-primary-key }}

      - name: Upload wheel
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}
          path: dist/*.whl
          if-no-files-found: error

  build-linux-wheel:
    name: Build manylinux_2_28 wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_SUBMODULES_TOKEN }}
          submodules: recursive

      - name: Identify native sources
        id: native-sources
        shell: bash
        run: |
          echo "revision=$(git rev-parse HEAD:scripts/mathtype-rust)-$(git rev-parse HEAD:scripts/latex2wmf)" >> "$GITHUB_OUTPUT"

      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/pmt-native-cache/cargo/registry
            ${{ runner.temp }}/pmt-native-cache/cargo/git
            ${{ runner.temp }}/pmt-native-cache/target
          key: native-v2-manylinux_2_28-x86_64-rust-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'scripts/mathtype-rust/Cargo.lock', 'scripts/latex2wmf/Cargo.lock', 'tools/papper-dev/**', '.github/workflows/publish-pypi.yml') }}-${{ steps.native-sources.outputs.revision }}-${{ hashFiles('src/pandoc_manuscript/mathtype/Times+Symbol 12.eqp') }}
          restore-keys: |
            native-v2-manylinux_2_28-x86_64-rust-${{ env.RUSTUP_TOOLCHAIN }}-
            native-v1-manylinux_2_28-x86_64-rust-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Restore manylinux Haskell dependency cache
        id: haskell-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/pmt-native-cache/cabal/packages
            ${{ runner.temp }}/pmt-native-cache/cabal/store
          key: pandoc-worker-v2-manylinux_2_28-x86_64-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-${{ hashFiles('scripts/pandoc-server/**/*.hs', 'scripts/pandoc-server/*.cabal', 'scripts/pandoc-server/cabal.project', 'tools/papper-dev/**', '.github/workflows/publish-pypi.yml') }}
          restore-keys: |
            pandoc-worker-v2-manylinux_2_28-x86_64-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-
            pandoc-worker-v1-manylinux_2_28-x86_64-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-

      - name: Install uv for container installation checks
        uses: astral-sh/setup-uv@v8.2.0

      # Native builds and installed-wheel checks share the glibc 2.28 baseline.
      - name: Build and smoke test inside manylinux 2.28
        shell: bash
        env:
          PRIVATE_SUBMODULES_TOKEN: ${{ secrets.PRIVATE_SUBMODULES_TOKEN }}
          NATIVE_CACHE_DIR: ${{ runner.temp }}/pmt-native-cache
        run: |
          set -euo pipefail
          mkdir -p "$NATIVE_CACHE_DIR"
          # The token is passed by environment name. Global Git config remains
          # in the disposable container and is never included in cached paths.
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/project" \
            --volume "$NATIVE_CACHE_DIR:$NATIVE_CACHE_DIR" \
            --volume "$(command -v uv):/usr/local/bin/uv:ro" \
            --workdir /project \
            --env CARGO_HOME="$NATIVE_CACHE_DIR/cargo" \
            --env CARGO_TARGET_DIR="$NATIVE_CACHE_DIR/target" \
            --env CABAL_DIR="$NATIVE_CACHE_DIR/cabal" \
            --env GHCUP_INSTALL_BASE_PREFIX=/opt/papper-haskell \
            --env UV_PYTHON=/opt/python/cp311-cp311/bin/python \
            --env PRIVATE_SUBMODULES_TOKEN \
            --env RUSTUP_TOOLCHAIN --env CARGO_INCREMENTAL \
            --env GHC_VERSION --env CABAL_VERSION \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -euo pipefail -c '
              export PATH="$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin:$CARGO_HOME/bin:/opt/python/cp311-cp311/bin:$PATH"
              git config --global --add safe.directory /project
              git config --global \
                url."https://x-access-token:${PRIVATE_SUBMODULES_TOKEN}@github.com/cesaryuan/latex2wmf".insteadOf \
                "https://github.com/cesaryuan/latex2wmf"
              bash scripts/pandoc-server/setup-manylinux.sh
              cargo run --locked -p papper-dev -- wheel --output dist --platform manylinux_2_28_x86_64
              shopt -s nullglob
              wheels=(dist/*.whl)
              test "${#wheels[@]}" = 1
              cargo run --locked -p papper-dev -- smoke --wheel "${wheels[0]}"
              # Atomic writes leave root-owned wheels at 0600; the host runner
              # needs read access when upload-artifact opens them outside Docker.
              chmod 0644 -- "${wheels[@]}"
            '
          # Check the container-to-host handoff as the user that uploads artifacts.
          for wheel in dist/*.whl; do
            test -r "$wheel"
            stat -c '%U:%G %a %n' "$wheel"
          done

      - name: Prepare Linux cache for archiving
        if: github.ref == 'refs/heads/main' && (steps.rust-cache.outputs.cache-hit != 'true' || steps.haskell-cache.outputs.cache-hit != 'true')
        shell: bash
        env:
          NATIVE_CACHE_DIR: ${{ runner.temp }}/pmt-native-cache
        run: |
          set -euo pipefail
          # manylinux writes as root; the host cache action archives as runner.
          # Restrict ownership changes to this job's cache, without following links.
          test "$NATIVE_CACHE_DIR" = "$RUNNER_TEMP/pmt-native-cache"
          test -d "$NATIVE_CACHE_DIR" && test ! -L "$NATIVE_CACHE_DIR"
          sudo chown -R -P --no-dereference "$(id -u):$(id -g)" -- "$NATIVE_CACHE_DIR"
          find "$NATIVE_CACHE_DIR" -type d -exec chmod u+rwx {} +
          find "$NATIVE_CACHE_DIR" -type f -exec chmod u+rw {} +
          for entry in cargo/registry cargo/git target cabal/packages cabal/store; do
            directory="$NATIVE_CACHE_DIR/$entry"
            test -d "$directory"
            stat -c '%U:%G %a %n' "$directory"
            du -sh "$directory"
            unreadable=$(find "$directory" \( -type f ! -readable \) -o \( -type d \( ! -readable -o ! -executable \) \))
            if [[ -n "$unreadable" ]]; then
              printf '::error::Cache contains inaccessible paths\n%s\n' "$unreadable"
              exit 1
            fi
          done

      - name: Save Rust build cache
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/pmt-native-cache/cargo/registry
            ${{ runner.temp }}/pmt-native-cache/cargo/git
            ${{ runner.temp }}/pmt-native-cache/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Save manylinux Haskell dependency cache
        if: github.ref == 'refs/heads/main' && steps.haskell-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/pmt-native-cache/cabal/packages
            ${{ runner.temp }}/pmt-native-cache/cabal/store
          key: ${{ steps.haskell-cache.outputs.cache-primary-key }}

      # save reports archive failures as warnings; require a remotely visible entry.
      - name: Verify Linux cache was saved
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/pmt-native-cache/cargo/registry
            ${{ runner.temp }}/pmt-native-cache/cargo/git
            ${{ runner.temp }}/pmt-native-cache/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Upload Linux wheel
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: wheel-Linux
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish platform wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-linux-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        # MathType's private sources are not distributed. The GPL HTML worker's
        # adapted sources and notices are retained inside each platform wheel.
        run: uv publish dist/*.whl
