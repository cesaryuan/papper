name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Default-branch builds warm caches that later release tags can restore.
    # GitHub does not apply path filters to tag pushes.
    paths:
      - "scripts/mathtype-rust"
      - "scripts/mathtype-rust/**"
      - "scripts/latex2wmf"
      - "scripts/latex2wmf/**"
      - "scripts/pandoc-server/**"
      - "scripts/check_packaged_html_server.py"
      - "src/pandoc_manuscript/commands/pandoc_server_runtime.py"
      - "src/pandoc_manuscript/commands/setup/**"
      - "src/pandoc_manuscript/commands/doctor.py"
      - "src/pandoc_manuscript/runtime/resources.py"
      - "src/pandoc_manuscript/mathtype/Times+Symbol 12.eqp"
      - "src/pandoc_manuscript/mathtype/ole_helper/**"
      - "hatch_build.py"
      - ".github/workflows/publish-pypi.yml"
      - ".gitmodules"
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.98.0"
  CARGO_INCREMENTAL: "0"
  GHC_VERSION: "9.14.1"
  CABAL_VERSION: "3.18.1.0"

jobs:
  build-wheels:
    name: Build ${{ matrix.os }} wheel
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.pmt/native-target

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_SUBMODULES_TOKEN }}
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python
        run: uv python install 3.11

      - name: Set macOS 14 deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Prevent a newer macOS SDK from producing helpers that macOS 14.6
          # cannot load when the floating macos-latest image advances.
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"

      # Cargo fetches Git dependencies in its own cache, outside checkout's
      # credential scope. Keep the rewrite limited to the private dependency.
      - name: Authenticate private Cargo dependencies
        shell: bash
        env:
          PRIVATE_SUBMODULES_TOKEN: ${{ secrets.PRIVATE_SUBMODULES_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${PRIVATE_SUBMODULES_TOKEN}@github.com/cesaryuan/latex2wmf".insteadOf \
            "https://github.com/cesaryuan/latex2wmf"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal
          rustup show active-toolchain
          cargo --version

      - name: Identify native sources
        id: native-sources
        shell: bash
        run: |
          echo "revision=$(git rev-parse HEAD:scripts/mathtype-rust)-$(git rev-parse HEAD:scripts/latex2wmf)" >> "$GITHUB_OUTPUT"

      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .pmt/native-target
          key: native-v1-${{ matrix.os }}-${{ runner.arch }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('scripts/mathtype-rust/Cargo.lock', 'scripts/latex2wmf/Cargo.lock', 'hatch_build.py', '.github/workflows/publish-pypi.yml') }}-${{ steps.native-sources.outputs.revision }}-${{ hashFiles('src/pandoc_manuscript/mathtype/Times+Symbol 12.eqp') }}
          restore-keys: |
            native-v1-${{ matrix.os }}-${{ runner.arch }}-rust-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Check .NET SDK for the Windows helper
        if: runner.os == 'Windows'
        run: dotnet --version

      - name: Install pinned Haskell toolchain
        id: haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Restore Pandoc worker dependency cache
        id: haskell-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            scripts/pandoc-server/dist-newstyle
          key: pandoc-worker-v1-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-${{ hashFiles('scripts/pandoc-server/**/*.hs', 'scripts/pandoc-server/*.cabal', 'scripts/pandoc-server/cabal.project', 'hatch_build.py', '.github/workflows/publish-pypi.yml') }}
          restore-keys: |
            pandoc-worker-v1-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-

      - name: Build platform wheel
        run: uv build --wheel

      - name: Bundle macOS worker shared-library dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Haskell libraries are static; GMP and other C dependencies may still
          # come from Homebrew. Repair their paths before testing or publishing.
          uvx --from delocate delocate-wheel --check-archs -v -w repaired dist/*.whl
          mv repaired/*.whl dist/

      - name: Verify macOS 14 native helper compatibility
        if: runner.os == 'macOS'
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          helper_dir="$(mktemp -d)"
          trap 'rm -rf "$helper_dir"' EXIT
          unzip -q "$wheel" 'pandoc_manuscript/mathtype/bin/libmathtype_rust.dylib' -d "$helper_dir"
          for helper in "$helper_dir"/pandoc_manuscript/mathtype/bin/*; do
            min_os="$(otool -l "$helper" | awk '$1 == "minos" || $1 == "version" { print $2; exit }')"
            if [[ "$min_os" != 14.* ]]; then
              echo "Expected macOS 14 deployment target for $helper, got ${min_os:-missing}." >&2
              exit 1
            fi
          done

      - name: Smoke test packaged native helpers
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv run --isolated --no-project --with $wheel papper --help
          uv run --isolated --no-project --with $wheel pmt --help
          uv run --isolated --no-project --with $wheel python -c "from pandoc_manuscript.mathtype.ole_parts import check_mathtype_availability; assert check_mathtype_availability('rust').usable"
          uv run --isolated --no-project --with $wheel python -c "from pandoc_manuscript.mathtype.native import latex_to_equation, render_latex_to_wmf; assert latex_to_equation('x_1')['ole']; assert render_latex_to_wmf('x_1')['wmf']"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native library conversion failed' }

      - name: Smoke test installed Pandoc CLI and HTML server
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv run --isolated --no-project --with $wheel python scripts/check_packaged_html_server.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged HTML server conversion failed' }

      - name: Verify binary-only wheel contents
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          # Wheels are ZIP archives. GNU tar on Ubuntu cannot read them, unlike
          # the BSD tar implementations currently available on macOS and Windows.
          $entries = python -c @'
          import sys
          from zipfile import ZipFile

          # Windows CI can redirect Python output through cp1252 even when a
          # wheel contains Unicode paths. Escaping keeps the archive listing
          # readable by PowerShell without changing its ASCII runtime entries.
          sys.stdout.reconfigure(errors="backslashreplace")
          with ZipFile(sys.argv[1]) as wheel:
              print("\n".join(wheel.namelist()))
          '@ $wheel
          $libraries = if ($IsWindows) { @('mathtype_rust.dll') } else { @('libmathtype_rust.dylib') }
          foreach ($name in $libraries) {
            if (-not ($entries -match "pandoc_manuscript/mathtype/bin/$name")) {
              throw "Wheel is missing native runtime: $name"
            }
          }
          if ($IsWindows -and -not ($entries -match 'pandoc_manuscript/mathtype/ole_helper/bin/Release/net48/MathTypeOleHelper.exe')) {
            throw 'Windows wheel is missing MathTypeOleHelper.exe'
          }
          $forbidden = $entries | Where-Object {
            $_ -match '^pandoc_manuscript/mathtype/bin/(mathtype-rust|latex2wmf)(\.exe)?$' -or
            $_ -match '^pandoc_manuscript/mathtype/bin/(lib)?latex2wmf\.(dll|so|dylib)$' -or
            $_ -match 'scripts/(mathtype-rust|latex2wmf)/' -or
            $_ -match 'pandoc_manuscript/mathtype/ole_helper/.*\.(cs|csproj|pdb|config)$'
          }
          if ($forbidden) {
            throw "Wheel contains native helper source/debug files: $($forbidden -join ', ')"
          }

      # Save only on main: caches written under one tag cannot serve another tag.
      - name: Save Rust build cache
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .pmt/native-target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Save Pandoc worker dependency cache
        if: github.ref == 'refs/heads/main' && steps.haskell-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            scripts/pandoc-server/dist-newstyle
          key: ${{ steps.haskell-cache.outputs.cache-primary-key }}

      - name: Upload wheel
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}
          path: dist/*.whl
          if-no-files-found: error

  build-linux-wheel:
    name: Build manylinux_2_28 wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_SUBMODULES_TOKEN }}
          submodules: recursive

      - name: Identify native sources
        id: native-sources
        shell: bash
        run: |
          echo "revision=$(git rev-parse HEAD:scripts/mathtype-rust)-$(git rev-parse HEAD:scripts/latex2wmf)" >> "$GITHUB_OUTPUT"

      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/pmt-native-cache/cargo/registry
            ${{ runner.temp }}/pmt-native-cache/cargo/git
            ${{ runner.temp }}/pmt-native-cache/target
          key: native-v1-manylinux_2_28-x86_64-rust-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('scripts/mathtype-rust/Cargo.lock', 'scripts/latex2wmf/Cargo.lock', 'hatch_build.py', '.github/workflows/publish-pypi.yml') }}-${{ steps.native-sources.outputs.revision }}-${{ hashFiles('src/pandoc_manuscript/mathtype/Times+Symbol 12.eqp') }}
          restore-keys: |
            native-v1-manylinux_2_28-x86_64-rust-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Restore manylinux Haskell dependency cache
        id: haskell-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/pmt-native-cache/cabal/packages
            ${{ runner.temp }}/pmt-native-cache/cabal/store
          key: pandoc-worker-v1-manylinux_2_28-x86_64-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-${{ hashFiles('scripts/pandoc-server/**/*.hs', 'scripts/pandoc-server/*.cabal', 'scripts/pandoc-server/cabal.project', 'hatch_build.py', '.github/workflows/publish-pypi.yml') }}
          restore-keys: |
            pandoc-worker-v1-manylinux_2_28-x86_64-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-

      # Build inside manylinux to preserve the glibc 2.28 compatibility baseline.
      - name: Build Linux wheel
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BUILD: cp311-manylinux_x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: bash /project/scripts/pandoc-server/setup-manylinux.sh
          # The Cargo build happens in the manylinux container rather than on
          # the runner, so pass its private-repository token explicitly.
          PRIVATE_SUBMODULES_TOKEN: ${{ secrets.PRIVATE_SUBMODULES_TOKEN }}
          # /host persists Cargo downloads and compiled artifacts outside Docker.
          # Do not cache Git configuration: it contains the private access token.
          CIBW_ENVIRONMENT_LINUX: >-
            CARGO_HOME=/host${{ runner.temp }}/pmt-native-cache/cargo
            CARGO_TARGET_DIR=/host${{ runner.temp }}/pmt-native-cache/target
            CABAL_DIR=/host${{ runner.temp }}/pmt-native-cache/cabal
            GHCUP_INSTALL_BASE_PREFIX=/opt/papper-haskell
            PATH=/opt/papper-haskell/.ghcup/bin:$CARGO_HOME/bin:$PATH
          CIBW_ENVIRONMENT_PASS_LINUX: PRIVATE_SUBMODULES_TOKEN RUSTUP_TOOLCHAIN CARGO_INCREMENTAL GHC_VERSION CABAL_VERSION
          CIBW_BEFORE_BUILD_LINUX: >-
            git config --global
            url."https://x-access-token:${PRIVATE_SUBMODULES_TOKEN}@github.com/cesaryuan/latex2wmf".insteadOf
            "https://github.com/cesaryuan/latex2wmf"
        with:
          output-dir: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python
        run: uv python install 3.11

      - name: Smoke test packaged native helpers
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv run --isolated --no-project --with $wheel papper --help
          uv run --isolated --no-project --with $wheel pmt --help
          uv run --isolated --no-project --with $wheel python -c "from pandoc_manuscript.mathtype.ole_parts import check_mathtype_availability; assert check_mathtype_availability('rust').usable"
          uv run --isolated --no-project --with $wheel python -c "from pandoc_manuscript.mathtype.native import latex_to_equation, render_latex_to_wmf; assert latex_to_equation('x_1')['ole']; assert render_latex_to_wmf('x_1')['wmf']"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native library conversion failed' }

      - name: Smoke test installed Linux Pandoc CLI and HTML server
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv run --isolated --no-project --with $wheel python scripts/check_packaged_html_server.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged HTML server conversion failed' }

      - name: Verify Linux wheel contents and compatibility tag
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          if ($wheel.Name -notmatch 'manylinux_2_28_x86_64') {
            throw "Linux wheel does not have the expected manylinux_2_28_x86_64 tag: $($wheel.Name)"
          }
          $entries = python -c @'
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as wheel:
              print("\n".join(wheel.namelist()))
          '@ $wheel.FullName
          foreach ($name in @("libmathtype_rust.so")) {
            if (-not ($entries -match "pandoc_manuscript/mathtype/bin/$name")) {
              throw "Wheel is missing native runtime: $name"
            }
          }
          $forbidden = $entries | Where-Object {
            $_ -match '^pandoc_manuscript/mathtype/bin/(mathtype-rust|latex2wmf)(\.exe)?$' -or
            $_ -match '^pandoc_manuscript/mathtype/bin/(lib)?latex2wmf\.(dll|so|dylib)$' -or
            $_ -match 'scripts/(mathtype-rust|latex2wmf)/' -or
            $_ -match 'pandoc_manuscript/mathtype/ole_helper/.*\.(cs|csproj|pdb|config)$'
          }
          if ($forbidden) {
            throw "Wheel contains native helper source/debug files: $($forbidden -join ', ')"
          }

      - name: Prepare Linux cache for archiving
        if: github.ref == 'refs/heads/main' && (steps.rust-cache.outputs.cache-hit != 'true' || steps.haskell-cache.outputs.cache-hit != 'true')
        shell: bash
        env:
          NATIVE_CACHE_DIR: ${{ runner.temp }}/pmt-native-cache
        run: |
          set -euo pipefail
          # manylinux writes as root; the host cache action archives as runner.
          # Restrict ownership changes to this job's cache, without following links.
          test "$NATIVE_CACHE_DIR" = "$RUNNER_TEMP/pmt-native-cache"
          test -d "$NATIVE_CACHE_DIR" && test ! -L "$NATIVE_CACHE_DIR"
          sudo chown -R -P --no-dereference "$(id -u):$(id -g)" -- "$NATIVE_CACHE_DIR"
          find "$NATIVE_CACHE_DIR" -type d -exec chmod u+rwx {} +
          find "$NATIVE_CACHE_DIR" -type f -exec chmod u+rw {} +
          for entry in cargo/registry cargo/git target cabal/packages cabal/store; do
            directory="$NATIVE_CACHE_DIR/$entry"
            test -d "$directory"
            stat -c '%U:%G %a %n' "$directory"
            du -sh "$directory"
            unreadable=$(find "$directory" \( -type f ! -readable \) -o \( -type d \( ! -readable -o ! -executable \) \))
            if [[ -n "$unreadable" ]]; then
              printf '::error::Cache contains inaccessible paths\n%s\n' "$unreadable"
              exit 1
            fi
          done

      - name: Save Rust build cache
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/pmt-native-cache/cargo/registry
            ${{ runner.temp }}/pmt-native-cache/cargo/git
            ${{ runner.temp }}/pmt-native-cache/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Save manylinux Haskell dependency cache
        if: github.ref == 'refs/heads/main' && steps.haskell-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/pmt-native-cache/cabal/packages
            ${{ runner.temp }}/pmt-native-cache/cabal/store
          key: ${{ steps.haskell-cache.outputs.cache-primary-key }}

      # save reports archive failures as warnings; require a remotely visible entry.
      - name: Verify Linux cache was saved
        if: github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/pmt-native-cache/cargo/registry
            ${{ runner.temp }}/pmt-native-cache/cargo/git
            ${{ runner.temp }}/pmt-native-cache/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Upload Linux wheel
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: wheel-Linux
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish platform wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-linux-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        # MathType's private sources are not distributed. The GPL HTML worker's
        # adapted sources and notices are retained inside each platform wheel.
        run: uv publish dist/*.whl
