[workspace]
members = ["crates/papper-core", "crates/papper-document", "crates/papper-engine", "crates/papper-server", "crates/papper-platform", "crates/papper-cli", "crates/papper-svg", "tools/papper-dev"]
exclude = ["scripts/mathtype-rust", "scripts/latex2wmf"]
resolver = "3"

[workspace.package]
version = "0.9.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
yaml-rust = "0.4.5"
regex = "1.13"
sha2 = "0.11"
tempfile = "3.27"
roxmltree = "0.21"
html-escape = "0.2"
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
resvg = "0.47"
base64 = "0.22"
flate2 = "1.1"
percent-encoding = "2.3"
mime_guess = "2.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem"] }
mathtype-rust = { path = "scripts/mathtype-rust" }
latex2wmf = { git = "https://github.com/cesaryuan/latex2wmf", rev = "8b249492ac43d9635f381c8dfa74565b64a7649d" }
sha1 = "0.10"
tar = "0.4"
xz2 = "0.1"
sevenz-rust2 = "0.20"
pep440_rs = "0.7"
fancy-regex = "0.17"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
papper-core = { path = "crates/papper-core" }
papper-document = { path = "crates/papper-document" }
papper-engine = { path = "crates/papper-engine" }
papper-server = { path = "crates/papper-server" }
papper-platform = { path = "crates/papper-platform" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
